<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>香烟进销记录</title>
<style>
:root{--bg:#faf8f4;--card:#fff;--tx:#1d1b18;--mu:#7a746a;--ln:#e6e0d6;--ac:#b3402a;--ok:#2f7d4f;--warn:#c07d18;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171513;--card:#201d1a;--tx:#f0ebe3;--mu:#a09889;--ln:#34302b;--ac:#e0735b;--ok:#6cc08b;--warn:#d9a441;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171513;--card:#201d1a;--tx:#f0ebe3;--mu:#a09889;--ln:#34302b;--ac:#e0735b;--ok:#6cc08b;--warn:#d9a441;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overscroll-behavior:none}
body{background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:16px;max-width:720px;margin:0 auto;height:100%;overflow:hidden;display:flex;flex-direction:column}
#app{
  flex:1;
  overflow-y:auto;
  overscroll-behavior-y:contain;
  -webkit-overflow-scrolling:touch;
  padding-bottom:8px;
  padding-right:calc(6px + env(safe-area-inset-right,0px));
  scrollbar-gutter:stable;
}
h1{font-size:20px;margin:0}
.sub{color:var(--mu);font-size:12px;margin:2px 0 12px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1}
button,input,select{font:inherit;color:var(--tx)}
input,select,textarea{font-size:16px !important;
                     }
button{background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:7px 10px;cursor:pointer}
button.on{background:var(--ac);border-color:var(--ac);color:#fff}
input,select{background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:7px 8px;width:100%;box-sizing:border-box;max-width:100%}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:8px;justify-content:space-between}
.mu{color:var(--mu);font-size:12px}
.bar{height:6px;border-radius:3px;background:var(--ac);margin-top:6px;opacity:.75}
.step{display:flex;align-items:center;gap:8px}
.step b{min-width:28px;text-align:center;font-size:17px}
.step button{width:34px;height:34px;padding:0;font-size:18px}
.kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
.kpi div{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:10px}
.kpi b{display:block;font-size:18px}
.kpi .mu{display:block;margin-bottom:2px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--ln);text-align:right;white-space:nowrap}
th:first-child,td:first-child{
  text-align:left;
  position:sticky;
  left:0;
  z-index:2;
  background:var(--bg);
  box-shadow:2px 0 0 0 var(--ln);
}
.tag{font-size:11px;padding:1px 6px;border-radius:8px;border:1px solid var(--ln);color:var(--mu)}
.tag.warn{color:var(--ac);border-color:var(--ac)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.grid .full{grid-column:1/-1}
.badge{font-size:12px;color:var(--mu)}
.ok{color:var(--ok)}
.err{color:var(--ac)}
/* ===== 日期选择器：与整体主题统一 ===== */
input[type="month"],input[type="date"]{
  appearance:none;-webkit-appearance:none;
  background:var(--card);
  color:var(--tx);
  border:1px solid var(--ln);
  border-radius:8px;
  padding:8px 10px;
  font:inherit;
  width:100%;
  max-width:100%;
  box-sizing:border-box;
  display:block;
  margin-bottom:10px;
  cursor:pointer;
  transition:border-color .15s,box-shadow .15s;
}
input[type="month"]:hover,input[type="date"]:hover{border-color:var(--ac)}
input[type="month"]:focus,input[type="date"]:focus{
  outline:none;
  border-color:var(--ac);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 18%,transparent);
}
input[type="month"]::-webkit-calendar-picker-indicator,
input[type="date"]::-webkit-calendar-picker-indicator{
  cursor:pointer;
  opacity:.55;
  transition:opacity .15s;
}
input[type="month"]:hover::-webkit-calendar-picker-indicator,
input[type="date"]:hover::-webkit-calendar-picker-indicator{opacity:.85}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) input[type="month"]::-webkit-calendar-picker-indicator,
  :root:not([data-theme="light"]) input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(.85)}
}
:root[data-theme="dark"] input[type="month"]::-webkit-calendar-picker-indicator,
:root[data-theme="dark"] input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(.85)}
/* ===== 货源录入行 ===== */
.srcs{margin-top:8px;border-top:1px dashed var(--ln);padding-top:8px;display:grid;gap:6px}
.src{display:flex;align-items:center;gap:8px}
.src .nm{font-size:12px;min-width:34px;color:var(--mu)}
.src .nm.t{color:var(--ok)}
.src .nm.d{color:var(--warn)}
.src .step{flex:0 0 auto}
.src .step button{width:28px;height:28px;font-size:16px}
.src .step b{min-width:24px;font-size:15px}
.src .pr{flex:1;display:flex;align-items:center;gap:4px}
.src .pr span{font-size:11px;color:var(--mu);white-space:nowrap}
.src .pr input{padding:4px 6px;font-size:16px;border-radius:6px}
.src.off{opacity:.4}
.srcs .sum{font-size:11px;color:var(--mu);text-align:right}
/* ===== 开烟批次 ===== */
.bh{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:10px;margin-bottom:10px}
.bh>.row:first-child{margin-bottom:8px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font-size:12px;padding:5px 10px;border-radius:16px;border:1px solid var(--ln);background:var(--card);cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.chip b{font-variant-numeric:tabular-nums}
.bform{border-top:1px dashed var(--ln);padding-top:8px;display:grid;gap:6px}
.blist{display:grid;gap:6px}
.bitem{display:flex;align-items:center;gap:8px;font-size:12px;border:1px solid var(--ln);border-radius:8px;padding:6px 8px}
.bitem .no{font-size:11px;color:var(--ac);border:1px solid var(--ac);border-radius:10px;padding:0 5px;flex:0 0 auto}
.bitem .dt{font-weight:600;font-variant-numeric:tabular-nums;flex:0 0 auto}
.bitem .nt{color:var(--mu);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bitem .q{color:var(--mu);font-variant-numeric:tabular-nums;flex:0 0 auto}
.bitem button{flex:0 0 auto;padding:3px 7px;font-size:11px;border-radius:6px}
.btot{font-size:11px;color:var(--mu);margin-bottom:8px;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.btot::-webkit-scrollbar{display:none}
.btot i{font-style:normal;color:var(--ac);margin:0 4px}
/* ===== 录入面板（复用已有视觉，仅控制滚动） ===== */
.pick{max-height:40vh;overflow-y:auto;display:grid;gap:6px;margin-top:6px;overscroll-behavior:contain}
.pick .bitem{cursor:pointer}
.pick .bitem:hover{border-color:var(--ac)}
</style>
</head>
<body>
<h1>香烟进销记录</h1>
<div class="sub" id="meta"></div>
<div id="app"></div>
<script type="application/json" id="data">{"products":[],"log":{},"updated":""}</script>
<script>
const $=s=>document.querySelector(s);
const KEY='ciglog_data_v2';
const SCHEMA=2;                       // 备份 / 本地数据格式版本
const MAX_QTY=99999,MAX_MONEY=99999999;
const ss=(k,v)=>{try{if(v===undefined)return sessionStorage.getItem(k);sessionStorage.setItem(k,v)}catch(e){}};
const ym=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
let tab=ss('tab')||'log',month=ss('month')||ym(new Date()),editor=false,edit=null,delId=null,status='',tm;
let bSel=ss('bsel_'+month)||'all',bEdit=null,bDel=null,aEdit=null,aDel=null;
let pick={open:false,q:'',pid:null,newProd:false,newName:''};

function loadData(){
  try{const raw=localStorage.getItem(KEY);if(raw)return JSON.parse(raw)}catch(e){}
  try{return JSON.parse($('#data').textContent)}catch(e){return {products:[],log:{}}}
}
let S=loadData();

function splitLog(log){
  const batches={},rest={};
  Object.keys(log).forEach(k=>{
    if(k==='batches'){Object.assign(batches,log[k]);return}
    const v=log[k],r={};
    if(v&&typeof v==='object'&&v.batches){batches[k]=v.batches}
    Object.keys(v||{}).forEach(id=>{if(id!=='batches')r[id]=v[id]});
    rest[k]=r;
  });
  return {batches,rest};
}
function migrate(){
  let B={};
  if(S._batches){B=S._batches;delete S._batches}
  if(S.log.batches){Object.assign(B,splitLog(S.log).batches)}
  const {rest}=splitLog(S.log);
  S.log=rest;
  S.log.batches=B;
  months().forEach(m=>{
    if(!S.log[m]||typeof S.log[m]!=='object'){S.log[m]={};return}
    Object.keys(S.log[m]).forEach(id=>{
      const v=S.log[m][id],p=P(id);
      if(Array.isArray(v)){S.log[m][id]=v.map(f=>({b:f.b||0,src:f.src,qty:f.qty,price:f.price}));return}
      if(typeof v==='number'){S.log[m][id]=v?[{b:0,src:'t',qty:v,price:p?p.cost:0}]:[]}
      else if(v&&typeof v==='object'){
        const a=[];
        if(v.t)a.push({b:0,src:'t',qty:v.t,price:p?p.cost:0});
        if(v.d)a.push({b:0,src:'d',qty:v.d,price:p?(p.cost2||p.cost):0});
        S.log[m][id]=a;
      }else{S.log[m][id]=[]}
    });
  });
}

const fmt=n=>(Math.round(n*100)/100).toLocaleString('zh-CN');
const fmt0=n=>Math.round(n).toLocaleString('zh-CN');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P=id=>S.products.find(p=>p.id===id);
const num=v=>{const s=String(v==null?'':v).trim();if(!s)return 0;const n=Number(s);return Number.isFinite(n)?n:0};
// ===== 输入边界校验 & 旧数据清洗 =====
function chkQty(v,label){
  const s=String(v==null?'':v).trim();
  if(!/^\d+$/.test(s))return {ok:false,msg:(label||'条数')+'请填 0 或正整数，不要填小数、负号或文字'};
  const n=Number(s);
  if(n>MAX_QTY)return {ok:false,msg:(label||'条数')+'不能超过 '+MAX_QTY+'，请检查是否多输了 0'};
  return {ok:true,val:n};
}
function chkMoney(v,label,allowNeg){
  const s=String(v==null?'':v).trim();
  if(!s)return {ok:true,val:0,empty:true};
  if(!/^-?\d+(\.\d{1,2})?$/.test(s))return {ok:false,msg:(label||'金额')+'请填数字，最多两位小数'};
  const n=Number(s);
  if(!allowNeg&&n<0)return {ok:false,msg:(label||'金额')+'不能填负数'};
  if(Math.abs(n)>MAX_MONEY)return {ok:false,msg:(label||'金额')+'数值过大，请检查是否多输了 0'};
  return {ok:true,val:n,empty:false};
}
function chkProdForm(pre){
  const name=$('#'+pre+'_name').value.trim();
  if(!name)return '请填写品名。';
  if(name.length>60)return '品名不能超过 60 个字。';
  const fields=[['烟草批发价','cost'],['烟贩进货价','cost2'],['建议零售价','retail'],['红旗售价','actual']];
  for(let i=0;i<fields.length;i++){
    const r=chkMoney($('#'+pre+'_'+fields[i][1]).value,fields[i][0],false);
    if(!r.ok)return r.msg;
  }
  if(['在售','紧缺','停供'].indexOf($('#'+pre+'_status').value)<0)return '货源状态不合法。';
  if($('#'+pre+'_note').value.trim().length>200)return '备注不能超过 200 个字。';
  return '';
}
function sanitize(){
  if(!Array.isArray(S.products))S.products=[];
  if(!S.log||typeof S.log!=='object')S.log={};
  if(!S.adjust||typeof S.adjust!=='object')S.adjust={};
  Object.keys(S.log).forEach(k=>{
    if(k!=='batches'&&(!S.log[k]||typeof S.log[k]!=='object'))S.log[k]={};
  });
  S.products.forEach(p=>{
    p.name=String(p.name||'').slice(0,60);
    p.cost=Math.min(MAX_MONEY,Math.max(0,num(p.cost)));
    p.cost2=Math.min(MAX_MONEY,Math.max(0,num(p.cost2)));
    p.retail=Math.min(MAX_MONEY,Math.max(0,num(p.retail)));
    p.actual=Math.min(MAX_MONEY,Math.max(0,num(p.actual)));
    p.status=['在售','紧缺','停供'].indexOf(p.status)>=0?p.status:'在售';
    p.note=String(p.note||'').slice(0,200);
  });
  months().forEach(m=>{
    Object.keys(S.log[m]).forEach(id=>{
      S.log[m][id]=flow(m,id).map(f=>({
        b:Number.isFinite(Number(f.b))?Number(f.b):0,
        src:f.src==='d'?'d':'t',
        qty:Math.min(MAX_QTY,Math.max(0,Math.round(num(f.qty)))),
        price:Math.min(MAX_MONEY,Math.max(0,num(f.price)))
      })).filter(f=>f.qty>0);
      if(!S.log[m][id].length)delete S.log[m][id];
    });
  });
  Object.keys(S.adjust).forEach(m=>{
    if(!Array.isArray(S.adjust[m])){delete S.adjust[m];return}
    S.adjust[m]=S.adjust[m].filter(r=>r&&P(r.pid)).map(r=>({
      id:Number(r.id)||1,
      date:String(r.date||'').slice(0,10),
      pid:r.pid,
      qty:Math.min(MAX_QTY,Math.max(0,Math.round(num(r.qty)))),
      amount:Math.max(-MAX_MONEY,Math.min(MAX_MONEY,num(r.amount))),
      note:String(r.note||'').slice(0,200)
    }));
    if(!S.adjust[m].length)delete S.adjust[m];
  });
  S.schema=SCHEMA;
}
function delImpact(id){
  let ms=0,fs=0;
  months().forEach(m=>{const a=flow(m,id);if(a.length){ms++;fs+=a.length}});
  let as=0;
  if(S.adjust)Object.keys(S.adjust).forEach(m=>{as+=(S.adjust[m]||[]).filter(r=>r.pid===id).length});
  return {ms,fs,as};
}
function batchImpact(m,id){
  let ps=0,fs=0;
  Object.keys(S.log[m]||{}).forEach(k=>{
    if(k==='batches')return;
    const a=flow(m,k).filter(f=>f.b===id);
    if(a.length){ps++;fs+=a.length}
  });
  return {ps,fs};
}

function flow(m,id){const v=S.log[m]&&S.log[m][id];return Array.isArray(v)?v:[]}
const months=()=>Object.keys(S.log).filter(k=>k!=='batches');
const bts=m=>(S.log.batches&&S.log.batches[m])||[];
const bt=(m,id)=>bts(m).find(b=>b.id===id);
const inB=(f,b)=>!b||b==='all'||f.b===b;
const bqty=(m,id,b)=>flow(m,id).filter(f=>inB(f,b)).reduce((a,f)=>a+f.qty,0);
const bqtyOf=(m,id,b,src)=>flow(m,id).filter(f=>inB(f,b)&&f.src===src).reduce((a,f)=>a+f.qty,0);
const bcost=(m,id,b)=>flow(m,id).filter(f=>inB(f,b)).reduce((a,f)=>a+f.qty*f.price,0);
const bpriceOf=(m,id,b,src)=>{const f=flow(m,id).find(f=>inB(f,b)&&f.src===src);return f?f.price:''};
const btQty=(m,b)=>S.products.reduce((a,p)=>a+bqty(m,p.id,b),0);
const btCost=(m,b)=>S.products.reduce((a,p)=>a+bcost(m,p.id,b),0);
const btFlag=(m,b)=>S.products.reduce((a,p)=>a+bqty(m,p.id,b)*flagOf(p),0);
const qty=(m,id)=>bqty(m,id,'all');
const costOf=(m,id)=>bcost(m,id,'all');
const flagOf=p=>p.actual||(p.retail*10);

// ===== 特殊处置（还款 / 换烟贩）与烟贩价利润 =====
const adjs=m=>(S.adjust&&S.adjust[m])||[];
// 账面按红旗价卖了，实际只抵/换了 amount 元：差额就是要从估算利润里扣掉的
const adjImpact=m=>adjs(m).reduce((a,r)=>{
  const p=P(r.pid);
  const book=p?r.qty*flagOf(p):r.amount;
  return a+(book-r.amount);
},0);
// 只算从烟贩渠道（d）进的烟：红旗售价 - 当时实际进价
const dProfit=m=>S.products.reduce((a,p)=>
  a+flow(m,p.id).filter(f=>f.src==='d').reduce((s,f)=>s+f.qty*(flagOf(p)-f.price),0),0);
function defaultBatchDate(){
  const d=new Date();
  const today=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  return today.slice(0,7)===month ? today : month+'-01';
}
function addBatch(m,date,note){
  S.log.batches=S.log.batches||{};
  const arr=S.log.batches[m]=S.log.batches[m]||[];
  const id=arr.reduce((a,b)=>Math.max(a,b.id),0)+1;
  arr.push({id,date,note});
  arr.sort((a,b)=>String(a.date).localeCompare(String(b.date))||a.id-b.id);
  return id;
}
function sortedBatches(m){
  const arr=bts(m).slice();
  arr.sort((a,b)=>{
    const da=a.date||'', db=b.date||'';
    if(!da) return 1;
    if(!db) return -1;
    return da.localeCompare(db) || a.id-b.id;
  });
  return arr;
}
function delBatch(m,id){
  S.log.batches[m]=bts(m).filter(b=>b.id!==id);
  if(!S.log.batches[m].length)delete S.log.batches[m];
  Object.keys(S.log[m]||{}).forEach(k=>{
    if(k==='batches')return;
    S.log[m][k]=flow(m,k).filter(f=>f.b!==id);
    if(!S.log[m][k].length)delete S.log[m][k];
  });
}

function touch(){
  S.updated=new Date().toISOString();
  status='保存中…';meta();clearTimeout(tm);tm=setTimeout(save,600);
}
function save(){
  try{
    const {batches,rest}=splitLog(S.log);
    localStorage.setItem(KEY,JSON.stringify(Object.assign({},S,{log:rest,_batches:batches,schema:SCHEMA})));
    status='已保存';
  }catch(e){
    status='保存失败：'+(e&&e.name==='QuotaExceededError'?'存储空间已满':'未知错误');
  }
  meta();
}
function meta(){
  const t=S.updated?new Date(S.updated).toLocaleString('zh-CN',{hour12:false}):'尚无更新';
  $('#meta').innerHTML='<span class="ok">编辑模式</span> · 更新于 '+t+
    (status?' · <span class="'+(status.startsWith('保存失败')?'err':'')+'">'+status+'</span>':'')+
    ' · <button data-act="export" style="padding:2px 8px;font-size:12px">导出备份</button>'+
    ' <button data-act="import" style="padding:2px 8px;font-size:12px">导入恢复</button>'+
    '<input type="file" id="impFile" accept="application/json,.json" style="display:none">';
}
function exportData(){
  const {batches,rest}=splitLog(S.log);
  const blob=new Blob([JSON.stringify(Object.assign({},S,{log:rest,_batches:batches,schema:SCHEMA}),null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='香烟进销记录-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function importData(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d||!Array.isArray(d.products)||!d.log||typeof d.log!=='object')throw new Error('格式不对');
      const vs=d.schema==null?0:Number(d.schema);
      let note='';
      if(!Number.isFinite(vs)||vs<1)note='\n\n⚠️ 这份备份没有版本号（旧版导出），会按当前格式自动兼容导入。';
      else if(vs>SCHEMA)note='\n\n⚠️ 这份备份来自更新的格式（v'+vs+'），本文件是 v'+SCHEMA+'，可能读不全新字段，建议先留着原文件别删。';
      else if(vs<SCHEMA)note='\n\n这是 v'+vs+' 的旧备份，会自动升级到 v'+SCHEMA+'。';
      if(!confirm('导入将覆盖当前全部数据，确定继续？'+note))return;
      S=d;S.adjust=S.adjust||{};
      if(S._batches){S.log.batches=S._batches;delete S._batches}
      migrate();sanitize();
      edit=null;delId=null;editor=false;bEdit=null;bDel=null;aEdit=null;aDel=null;
      bSel='all';ss('bsel_'+month,'all');
      pick={open:false,q:'',pid:null,newProd:false,newName:''};
      save();render();alert('导入成功'+(note?'（已完成兼容处理）':''));
    }catch(e){alert('导入失败：'+e.message)}
  };
  r.readAsText(file);
}

function setQty(m,id,src,b,q,price){
  const qn=Number(q);q=Number.isFinite(qn)?Math.min(MAX_QTY,Math.max(0,Math.round(qn))):0;
  const keep=flow(m,id).filter(f=>!(inB(f,b)&&f.src===src));
  if(q>0)keep.push({b:b==='all'?0:b,src,qty:q,price:Math.min(MAX_MONEY,Math.max(0,num(price)))});
  S.log[m]=S.log[m]||{};
  S.log[m][id]=keep;
  if(!keep.length)delete S.log[m][id];
}
function setPrice(m,id,src,b,price){
  const r=chkMoney(price,'进货单价',false);
  if(!r.ok)return false;
  const f=flow(m,id).find(f=>inB(f,b)&&f.src===src);
  if(f)f.price=r.val;
  return true;
}

function dupOf(name,excludeId){
  const n=String(name||'').trim().toLowerCase();
  if(!n)return null;
  return S.products.find(p=>String(p.name||'').trim().toLowerCase()===n&&p.id!==excludeId)||null;

  const k=String(kw||'').trim().toLowerCase();

  return S.products.filter(p=>p.id!==excludeId&&String(p.name||'').toLowerCase().includes(k)).slice(0,6);

'<b style="font-size:18px">'+(showing?bn+' <span class="mu" style="font-size:12px">/ 月 '+n+'</span>':n+' 条')+'</b></div>'+
'<div class="mu" style="margin-top:4px"><span style="color:var(--ac);font-weight:600">烟草 '+bqtyOf(month,p.id,sb,'t')+'</span> 条 · <span style="color:var(--ac);font-weight:600">烟贩 '+bqtyOf(month,p.id,sb,'d')+'</span> 条</div>'+
body+(disp?'<div class="bar" style="width:'+(disp/viewMx*100)+'%"></div>':'')+
'<div style="text-align:right;margin-top:6px"><button data-act="editCard" data-v="'+p.id+'" style="padding:2px 8px;font-size:12px">'+(editor?'完成':'修改')+'</button></div>'+
'</div>';
  });
  return h+'<div class="mu">单位为「条」（1 条 = 10 包）。红旗售价未填时按建议价×10 计。销售额按进货量估算，未计入未售库存。</div>';
}

function srcRow(src,label,m,p,b,q){
  const pr=bpriceOf(m,p.id,b,src);
  const ph=src==='t'?p.cost:(p.cost2||p.cost);
  const locked=b==='all';

  return '<div class="src '+(q?'':'off')+'">'+
    '<span class="nm '+src+'">'+label+'</span>'+
    '<span class="step">'+
    '<button data-act="dec" data-src="'+src+'" data-v="'+p.id+'"'+(locked?' disabled':'')+'>−</button>'+
    '<b>'+q+'</b>'+
    '<button data-act="inc" data-src="'+src+'" data-v="'+p.id+'"'+(locked?' disabled':'')+'>+</button>'+
    '</span>'+
    (q?'<span class="pr"><span>@</span><input type="number" step="0.1" min="0" placeholder="'+fmt(ph)+'" value="'+pr+'" data-act="price" data-src="'+src+'" data-v="'+p.id+'"'+(locked?' disabled':'')+'></span>':'<span class="pr mu">点 + 添加</span>')+
    '</div>';
}

function viewSum(){
  const ms=months().filter(m=>Object.keys(S.log[m]).length).sort().reverse().slice(0,12);
  if(!ms.length)return '<div class="card mu">还没有月度记录。</div>';
  let h='<div class="scroll"><table><tr><th>烟品（条）</th>'+ms.map(m=>'<th>'+m.slice(2)+'</th>').join('')+'<th>合计</th></tr>';
  S.products.forEach(p=>{
    const v=ms.map(m=>qty(m,p.id));const s=v.reduce((a,b)=>a+b,0);
    if(s)h+='<tr><td>'+esc(p.name)+'</td>'+v.map(x=>'<td>'+(x||'·')+'</td>').join('')+'<td><b>'+s+'</b></td></tr>';
  });
  const mt=ms.map(m=>S.products.reduce((a,p)=>a+qty(m,p.id),0));
  const mc=ms.map(m=>S.products.reduce((a,p)=>a+costOf(m,p.id),0));
  const mf=ms.map(m=>S.products.reduce((a,p)=>a+qty(m,p.id)*flagOf(p),0));
  h+='<tr style="border-top:2px solid var(--ln)"><td style="padding-top:10px"><b>当月合计</b></td>'+mt.map(x=>'<td style="padding-top:10px"><b>'+x+'</b></td>').join('')+'<td style="padding-top:10px"><b>'+mt.reduce((a,b)=>a+b,0)+'</b></td></tr>';
  h+='<tr><td>进货成本</td>'+mc.map(x=>'<td>'+fmt0(x)+'</td>').join('')+'<td>'+fmt0(mc.reduce((a,b)=>a+b,0))+'</td></tr>';
  h+='<tr><td>红旗销售额</td>'+mf.map(x=>'<td>'+fmt0(x)+'</td>').join('')+'<td>'+fmt0(mf.reduce((a,b)=>a+b,0))+'</td></tr>';
  h+='<tr><td>实际利润</td>'+mf.map((x,i)=>{const v=x-mc[i];return '<td class="'+(v>=0?'ok':'err')+'">'+fmt0(v)+'</td>'}).join('')+'<td class="'+(mf.reduce((a,b)=>a+b,0)-mc.reduce((a,b)=>a+b,0)>=0?'ok':'err')+'">'+fmt0(mf.reduce((a,b)=>a+b,0)-mc.reduce((a,b)=>a+b,0))+'</td></tr>';
  h+='</table></div>';
  return h+'<div class="mu" style="margin-top:8px">显示最近 12 个有记录的月份。金额单位为元，按各月实际进货单价计算。</div>';
}

function viewProd(){
  let h='';
  if(!edit)h+='<button data-act="new" style="width:100%;margin-bottom:10px">＋ 添加烟品</button>';
  if(edit){
    const p=edit==='new'?{name:'',cost:'',cost2:'',retail:'',actual:'',status:'在售',note:''}:P(edit);
    h+='<div class="card"><b>'+(edit==='new'?'添加烟品':'编辑烟品')+'</b>'+
      prodFields(p,'f')+
      '<div class="row"><button data-act="cancel">取消</button><button class="on" data-act="saveP">确定</button></div></div>';
  }

  // 全局有记录的月数（分母）
  const activeMonths=months().filter(m=>Object.keys(S.log[m]||{}).length>0).length;

  // 月均进货条数：总量 ÷ 全局有记录月数；停供返回 -1 强制沉底
  const avgOf=p=>{
    if(p.status==='停供')return -1;
    if(!activeMonths)return 0;
    let total=0;
    months().forEach(m=>{total+=qty(m,p.id);});
    return total/activeMonths;
  };

  // 按“月均条数”从高到低排序
  const sorted=[...S.products].sort((a,b)=>avgOf(b)-avgOf(a));

  sorted.forEach(p=>{
    const m=p.retail*10-p.cost;
    const di=delId===p.id?delImpact(p.id):null;
    const avg=avgOf(p);
    const avgTxt=p.status==='停供'?'':(avg>0?' · 月均 <span class="ok">'+fmt(avg)+'</span> 条':'');
    h+='<div class="card"><div class="row"><b>'+esc(p.name)+' <span class="tag'+(p.status!=='在售'?' warn':'')+'">'+p.status+'</span></b>'+
    '<span><button data-act="edit" data-v="'+p.id+'">编辑</button> <button data-act="del" data-v="'+p.id+'">'+(delId===p.id?'再点确认删除':'删除')+'</button></span></div>'+
    (di?'<div class="err" style="font-size:12px;margin-top:6px">⚠️ 再点一次将永久删除「'+esc(p.name)+'」，并连带清掉 '+di.ms+' 个月份的 '+di.fs+' 笔进货流水'+(di.as?'、'+di.as+' 笔特殊处置':'')+'，无法撤销。若只是不再卖了，建议改为「停供」保留历史。</div>':'')+
    '<div class="mu">烟草 '+fmt(p.cost)+'/条'+(p.cost2?' · 烟贩 '+fmt(p.cost2)+'/条':'')+' · 建议零售 '+fmt(p.retail)+'/包（'+fmt(p.retail*10)+'/条）· 红旗 '+fmt(flagOf(p))+'/条</div>'+
    '<div class="mu">建议价毛利 '+fmt(m)+'/条'+(p.actual?' · 红旗毛利 <span class="'+(p.actual-p.cost>=0?'ok':'err')+'">'+fmt(p.actual-p.cost)+'</span>/条':'')+(p.cost2?' · 烟贩价利润 <span class="'+(flagOf(p)-p.cost2>=0?'ok':'err')+'">'+fmt(flagOf(p)-p.cost2)+'</span>/条':'')+
    avgTxt+
    (p.note?'<div class="badge">'+esc(p.note)+'</div>':'')+'</div></div>';
  });
  return h+'<div class="mu">按「月均进货条数」从高到低排序（分母为全局有记录的月数，停供烟沉底）。删除会同时清除该烟的历史流水，一般建议改为「停供」。</div>';
}

function scrollChipIntoView(){
  const chip=document.querySelector('#app .chips .chip.on');
  if(chip && chip.parentElement){
    const parent=chip.parentElement;
    const target=chip.offsetLeft - (parent.clientWidth - chip.offsetWidth)/2;
    parent.scrollLeft=Math.max(0, target);   // 直接瞬间定位，不做动画
  }
}

function render(){
  meta();
  // 交互状态若还指向已被删除 / 已不存在的烟品或批次，先复位，避免渲染时报错白屏
  if(pick.pid&&!P(pick.pid))pick={open:false,q:'',pid:null,newProd:false,newName:''};
  if(edit&&edit!=='new'&&!P(edit)){edit=null;delId=null}
  if(bSel!=='all'&&!bt(month,bSel))bSel='all';
  $('#app').innerHTML=tabs()+(tab==='log'?viewLog():tab==='sum'?viewSum():viewProd());
  if(pick.open&&!pick.pid&&!pick.newProd){const el=$('#pk_q');if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length)}}
  if(aEdit)refreshAdjRef();
  refreshNameHint();
  requestAnimationFrame(()=>{requestAnimationFrame(scrollChipIntoView)});
}

let composing=false;
const typingId=id=>id==='pk_q'||id==='f_name'||id==='qp_name';
document.addEventListener('compositionstart',e=>{ if(typingId(e.target.id))composing=true; });
document.addEventListener('compositionend',e=>{
  composing=false;
  const id=e.target.id;
  if(id==='pk_q'){pick.q=e.target.value;refreshPickList()}
  else if(id==='f_name'||id==='qp_name')refreshNameHint();
});
document.addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='pk_q'){
    pick.q=e.target.value;
    if(!composing)refreshPickList();
  }
  if((id==='f_name'||id==='qp_name')&&!composing)refreshNameHint();
  if(id==='a_qty'||id==='a_pid')refreshAdjRef();
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='mo'&&t.value){
    month=t.value;ss('month',month);bSel=ss('bsel_'+month)||'all';
    bEdit=null;bDel=null;edit=null;pick={open:false,q:'',pid:null,newProd:false,newName:''};
    render();return;
  }
  if(t.dataset&&t.dataset.act==='price'){
    if(bSel==='all'){
      alert('全部批次视图不能修改价格，请先选择具体批次。');
      render();
      return;
    }
    if(!setPrice(month,t.dataset.v,t.dataset.src,curB(),t.value)){
      alert('进货单价请填数字，最多两位小数，且不能为负数。');
      render();return;
    }
    touch();
  }
  if(t.id==='a_pid'||t.id==='a_qty')refreshAdjRef();
  if(t.id==='impFile'&&t.files&&t.files[0])importData(t.files[0]);
});
document.addEventListener('focusout',e=>{
  if(e.target.dataset&&e.target.dataset.act==='price')render();
});
document.addEventListener('keydown',e=>{
  if(e.target.id==='pk_q'){
    if(e.key==='Escape'){pick={open:false,q:'',pid:null,newProd:false,newName:''};render()}
    if(e.key==='Enter'){
      const kw=pick.q.trim().toLowerCase();
      const list=S.products.filter(p=>p.status!=='停供'&&(!kw||p.name.toLowerCase().includes(kw)));
      if(list.length===1){pick.pid=list[0].id;pick.q='';render()}
    }
  }
});

function curB(){
  if(bSel&&bSel!=='all'&&bt(month,bSel))return bSel;
  const f=bts(month)[0];
  return f?f.id:'all';
}
function ensureB(){
  if(bts(month).length)return curB();
  return addBatch(month,defaultBatchDate(),'');
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,src=b.dataset.src;
  let v=b.dataset.v;
  if(v!==undefined&&!isNaN(Number(v)))v=Number(v);
  if(a==='tab'){tab=v;ss('tab',v);edit=null;bEdit=null;pick={open:false,q:'',pid:null,newProd:false,newName:''};render();return}
  if(a==='selB'){bSel=v;ss('bsel_'+month,v);bEdit=null;bDel=null;render();return}
  if(a==='export'){exportData();return}
  if(a==='import'){$('#impFile').click();return}
  if(a==='openPick'){
    if(bSel==='all'){
      alert('请先选择一个具体批次，再录入开烟记录。');
      return;
    }
    pick={open:true,q:'',pid:null,newProd:false,newName:''};
    bSel=curB();
    ss('bsel_'+month,bSel);
    render();
    return;
}
  if(a==='quickNew'){
    pick.newName=(pick.q||'').trim();pick.newProd=true;pick.pid=null;render();return
  }
  if(a==='quickCancel'){pick.newProd=false;pick.newName='';render();return}
  if(a==='quickSave'){
    const err=chkProdForm('qp');if(err){alert(err);return}
    const d=readProd('qp');
    const dup=dupOf(d.name,null);
    if(dup){alert('目录里已经有同名烟品了：'+dup.name+'。请换个名字，或点「返回搜索」直接选它。');return}
    const np=Object.assign({id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)},d);
    S.products.push(np);
    pick.newProd=false;pick.newName='';pick.pid=np.id;pick.q='';
    touch();render();return
  }
  if(a==='closePick'){pick={open:false,q:'',pid:null,newProd:false,newName:''};render();return}
  if(a==='repick'){pick.pid=null;pick.q='';render();return}
  if(a==='pick'){pick.pid=v;pick.q='';render();return}
  if(a==='inc'||a==='dec'){
    if(bSel==='all'){
      alert('当前是「全部批次」视图，请先选择具体批次再修改。');
      return;
    }
    const p=P(v);if(!p)return;
    const bid=ensureB(),s=src||'t';
    const cur=bqtyOf(month,v,bid,s);
    const next=a==='inc'?cur+1:cur-1;
    const ph=s==='d'?(p.cost2||p.cost):p.cost;
    const before=bpriceOf(month,v,bid,s);
    setQty(month,v,s,bid,next,before!==''?before:ph);
    if(bSel!==bid){bSel=bid;ss('bsel_'+month,bid)}
    touch();render();
  }else if(a==='newB'){bEdit='new';bDel=null;render()}
  else if(a==='editB'){bEdit=v;bDel=null;render()}
  else if(a==='cancelB'){bEdit=null;render()}
  else if(a==='saveB'){
    const d=$('#b_date').value||'';
    const n=$('#b_note').value.trim();
    if(bEdit==='new'){
      const id=addBatch(month,d,n);bSel=id;ss('bsel_'+month,id);
    }else{
      const bt0=bt(month,bEdit);
      if(bt0){bt0.date=d;bt0.note=n}
      bSel=bEdit;ss('bsel_'+month,bEdit);
    }
    bEdit=null;touch();render();
  }else if(a==='delB'){
    if(bDel!==v){bDel=v;render();return}
    delBatch(month,v);
    if(bSel===v||bSel===String(v))bSel='all';
    ss('bsel_'+month,bSel);
    bDel=null;touch();render();
  }else if(a==='adjNew'){
    if(!S.products.length){alert('先到「烟品目录」添加烟品，才能记特殊处置。');return}
    aEdit=true;aDel=null;render();return
  }else if(a==='adjCancel'){aEdit=null;render();return}
  else if(a==='adjSave'){
    const pid=$('#a_pid').value;
    const qc=chkQty($('#a_qty').value,'条数');
    if(!qc.ok){alert(qc.msg);return}
    if(!pid||!qc.val){alert('请选择烟品，并填写条数。');return}
    const q=qc.val,p0=P(pid);
    if(!p0){alert('这款烟已不存在，请重新选择。');return}
    const ac=chkMoney($('#a_amt').value,'实际抵 / 换到的金额',true);
    if(!ac.ok){alert(ac.msg);return}
    const amt=ac.empty?q*p0.cost:ac.val;
    S.adjust=S.adjust||{};
    const arr=S.adjust[month]=S.adjust[month]||[];
    const id=arr.reduce((x,r)=>Math.max(x,r.id),0)+1;
    arr.push({id,date:$('#a_date').value||defaultBatchDate(),pid,qty:q,amount:amt,note:$('#a_note').value.trim()});
    aEdit=null;aDel=null;touch();render();return
  }else if(a==='adjDel'){
    if(aDel!==v){aDel=v;render();return}
    S.adjust[month]=(S.adjust[month]||[]).filter(r=>r.id!==v);
    if(!S.adjust[month].length)delete S.adjust[month];
    aDel=null;touch();render();return
  }else if(a==='new'){edit='new';render()}
  else if(a==='edit'){edit=v;render()}
  else if(a==='cancel'){edit=null;render()}
  else if(a==='saveP'){
    const err=chkProdForm('f');if(err){alert(err);return}
    const d=readProd('f');
    const dup=dupOf(d.name,edit==='new'?null:edit);
    if(dup){alert('已经有同名烟品了：'+dup.name);return}
    if(edit==='new')S.products.push(Object.assign({id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)},d));
    else Object.assign(P(edit),d);
    edit=null;touch();render();
  }else if(a==='del'){
    if(delId!==v){delId=v;render();return}
    S.products=S.products.filter(p=>p.id!==v);
    months().forEach(m=>{delete S.log[m][v]});
    if(S.adjust)Object.keys(S.adjust).forEach(m=>{
      S.adjust[m]=S.adjust[m].filter(r=>r.pid!==v);
      if(!S.adjust[m].length)delete S.adjust[m];
    });
    delId=null;touch();render();
 }else if(a==='editCard'){
    editor=!editor;
    render();
  }
});

migrate();
sanitize();
render();
  
</script>
</body></html>
