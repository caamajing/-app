<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#f7f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141210" media="(prefers-color-scheme: dark)">
<title>香烟进销记录</title>
<style>
:root{
  --bg:#f7f5f1;
  --card:#fffcf8;
  --tx:#1c1917;
  --mu:#78716c;
  --ln:#e7e5e0;
  --ac:#9f2d1f;
  --ac-soft:color-mix(in srgb,var(--ac) 12%,transparent);
  --ok:#1f6b45;
  --warn:#b45309;
  --ink:#1c1917;
  --on:#fffcf8;
  --shadow:0 1px 2px rgba(28,25,23,.04),0 1px 3px rgba(28,25,23,.06);
  --radius:12px;
  --radius-sm:8px;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141210;
    --card:#1c1917;
    --tx:#f5f0e8;
    --mu:#a8a29e;
    --ln:#2e2a26;
    --ac:#e07a62;
    --ac-soft:color-mix(in srgb,var(--ac) 16%,transparent);
    --ok:#4ade80;
    --warn:#fbbf24;
    --ink:#f5f0e8;
    --on:#141210;
    --shadow:0 1px 2px rgba(0,0,0,.25),0 1px 3px rgba(0,0,0,.2);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141210;--card:#1c1917;--tx:#f5f0e8;--mu:#a8a29e;--ln:#2e2a26;
  --ac:#e07a62;--ac-soft:color-mix(in srgb,var(--ac) 16%,transparent);
  --ok:#4ade80;--warn:#fbbf24;--ink:#f5f0e8;--on:#141210;
  --shadow:0 1px 2px rgba(0,0,0,.25),0 1px 3px rgba(0,0,0,.2);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overscroll-behavior:none;overflow-x:hidden}
body{
  background:var(--bg);
  color:var(--tx);
  font:15px/1.55 -apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  padding:16px;
  max-width:720px;
  margin:0 auto;
  height:100%;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
#app{
  flex:1;
  overflow-y:auto;
  overflow-x:hidden;
  overscroll-behavior-y:contain;
  overscroll-behavior-x:contain;
  -webkit-overflow-scrolling:touch;
  padding-bottom:12px;
  padding-right:calc(6px + env(safe-area-inset-right,0px));
  scrollbar-gutter:stable;
}
h1{font-size:21px;font-weight:650;margin:20px 0 0;letter-spacing:-.02em}
.sub{color:var(--mu);font-size:12.5px;margin:4px 0 14px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1;min-height:44px;border-radius:10px;font-weight:500}
button,input,select{font:inherit;color:var(--tx)}
input,select,textarea{font-size:16px !important}
button{
  background:var(--card);
  border:1px solid var(--ln);
  border-radius:var(--radius-sm);
  padding:8px 12px;
  cursor:pointer;
  transition:background .12s,border-color .12s,transform .1s,box-shadow .12s;
  min-height:36px;
}
button:active{transform:scale(.97)}
button.on{
  background:var(--ink);
  border-color:var(--ink);
  color:var(--on);
  box-shadow:var(--shadow);
}
input,select{
  background:var(--card);
  border:1px solid var(--ln);
  border-radius:var(--radius-sm);
  padding:8px 10px;
  width:100%;
  max-width:100%;
  box-sizing:border-box;
  transition:border-color .15s,box-shadow .15s;
}
input:focus,select:focus{
  outline:none;
  border-color:var(--ac);
  box-shadow:0 0 0 3px var(--ac-soft);
}
.card{
  background:var(--card);
  border:1px solid var(--ln);
  border-radius:var(--radius);
  padding:14px;
  margin-bottom:12px;
  box-shadow:var(--shadow);
}
.row{display:flex;align-items:center;gap:8px;justify-content:space-between}
.mu{color:var(--mu);font-size:12.5px}
.bar{height:5px;border-radius:3px;background:var(--ac);margin-top:6px;opacity:.7}
.step{display:flex;align-items:center;gap:8px}
.step b{min-width:28px;text-align:center;font-size:17px;font-weight:600}
.step button{width:40px;height:40px;padding:0;font-size:20px;border-radius:10px}
.kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
.kpi div{background:var(--card);border:1px solid var(--ln);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow)}
.kpi b{display:block;font-size:18px;font-weight:650}
.kpi .mu{display:block;margin-bottom:3px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 8px;border-bottom:1px solid var(--ln);text-align:right;white-space:nowrap}
th:first-child,td:first-child{
  text-align:left;
  position:sticky;
  left:0;
  z-index:2;
  background:var(--card);
  box-shadow:2px 0 0 0 var(--ln);
}
.tag{font-size:11.5px;padding:2px 7px;border-radius:8px;border:1px solid var(--ln);color:var(--mu)}
.tag.warn{color:var(--ac);border-color:var(--ac);background:var(--ac-soft)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.grid .full{grid-column:1/-1}
.badge{font-size:12.5px;color:var(--mu)}
.ok{color:var(--ok)}
.err{color:var(--ac)}

/* 日期选择器 */
input[type="month"],input[type="date"]{
  appearance:none;-webkit-appearance:none;
  background:var(--card);
  color:var(--tx);
  border:1px solid var(--ln);
  border-radius:var(--radius-sm);
  padding:9px 11px;
  font:inherit;
  width:100%;
  max-width:100%;
  box-sizing:border-box;
  display:block;
  margin-bottom:12px;
  cursor:pointer;
  transition:border-color .15s,box-shadow .15s;
}
input[type="month"]:hover,input[type="date"]:hover{border-color:var(--ac)}
input[type="month"]:focus,input[type="date"]:focus{
  outline:none;
  border-color:var(--ac);
  box-shadow:0 0 0 3px var(--ac-soft);
}
input[type="month"]::-webkit-calendar-picker-indicator,
input[type="date"]::-webkit-calendar-picker-indicator{
  cursor:pointer;
  opacity:.55;
  transition:opacity .15s;
}
input[type="month"]:hover::-webkit-calendar-picker-indicator,
input[type="date"]:hover::-webkit-calendar-picker-indicator{opacity:.85}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) input[type="month"]::-webkit-calendar-picker-indicator,
  :root:not([data-theme="light"]) input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(.85)}
}
:root[data-theme="dark"] input[type="month"]::-webkit-calendar-picker-indicator,
:root[data-theme="dark"] input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(.85)}

/* 货源录入行 */
.srcs{margin-top:10px;border-top:1px dashed var(--ln);padding-top:10px;display:grid;gap:8px}
.src{display:flex;align-items:center;gap:8px}
.src .nm{font-size:12.5px;min-width:36px;color:var(--mu);font-weight:500}
.src .nm.t{color:var(--ok)}
.src .nm.d{color:var(--warn)}
.src .step{flex:0 0 auto}
.src .step button{width:40px;height:40px;font-size:20px;border-radius:10px}
.src .step b{min-width:26px;font-size:16px}
.src .pr{flex:1;display:flex;align-items:center;gap:5px}
.src .pr span{font-size:12px;color:var(--mu);white-space:nowrap}
.src .pr input{padding:5px 8px;font-size:16px;border-radius:7px}
.src.off{opacity:.42}
.srcs .sum{font-size:12px;color:var(--mu);text-align:right;margin-top:2px}

/* 开烟批次 */
.bh{background:var(--card);border:1px solid var(--ln);border-radius:var(--radius);padding:12px 14px;margin-bottom:12px;box-shadow:var(--shadow)}
.bh>.row:first-child{margin-bottom:10px}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;margin-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;
  font-size:12.5px;
  padding:6px 12px;
  border-radius:20px;
  border:1px solid var(--ln);
  background:var(--card);
  cursor:pointer;
  white-space:nowrap;
  min-height:34px;
  transition:background .12s,border-color .12s,color .12s,transform .1s;
}
.chip:active{transform:scale(.97)}
.chip.on{
  background:var(--ink);
  border-color:var(--ink);
  color:var(--on);
  font-weight:500;
}
.chip b{font-variant-numeric:tabular-nums}
.bform{border-top:1px dashed var(--ln);padding-top:10px;display:grid;gap:8px}
.blist{display:grid;gap:7px;min-width:0}
.bitem{
  display:flex;align-items:center;gap:8px;
  font-size:12.5px;
  border:1px solid var(--ln);
  border-radius:var(--radius-sm);
  padding:8px 10px;
  min-width:0;max-width:100%;
  background:var(--bg);
}
.bitem .no{font-size:11px;color:var(--ac);border:1px solid var(--ac);border-radius:10px;padding:1px 6px;flex:0 0 auto;font-weight:600}
.bitem .dt{font-weight:600;font-variant-numeric:tabular-nums;flex:0 0 auto}
.bitem .nt{color:var(--mu);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bitem .q{color:var(--mu);font-variant-numeric:tabular-nums;flex:0 0 auto}
.bitem button{flex:0 0 auto;padding:4px 8px;font-size:12px;border-radius:7px;min-height:30px}
.btot{font-size:12px;color:var(--mu);margin-bottom:10px;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.btot::-webkit-scrollbar{display:none}
.btot i{font-style:normal;color:var(--ac);margin:0 5px}

/* 特殊处置 */
.aitem{border:1px solid var(--ln);border-radius:10px;padding:10px 12px;font-size:12.5px;min-width:0;max-width:100%;background:var(--card)}
.aitem.on{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac-soft)}
.ahd{display:flex;align-items:center;gap:8px;cursor:pointer;min-width:0}
.ahd .at{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ahd .av{flex:0 0 auto;font-variant-numeric:tabular-nums}
.ahd .ar{flex:0 0 auto;font-size:12px;color:var(--mu)}
.abd{border-top:1px dashed var(--ln);margin-top:8px;padding-top:8px;display:grid;gap:6px;min-width:0}
.abd .kv{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;min-width:0}
.abd .kv>span:last-child{text-align:right;word-break:break-all}
.abd button{padding:5px 10px;font-size:12.5px;border-radius:7px}

/* 录入面板 */
.pick{max-height:40vh;overflow-y:auto;display:grid;gap:7px;margin-top:8px;overscroll-behavior:contain}
.pick .bitem{cursor:pointer;background:var(--card)}
.pick .bitem:hover{border-color:var(--ac)}

/* 汇总对比 */
.warn{color:var(--warn)}
.saxis{display:grid;gap:10px;min-width:0}
.scard{background:var(--card);border:1px solid var(--ln);border-radius:var(--radius);padding:12px 14px;min-width:0;max-width:100%;box-shadow:var(--shadow)}
.scard.on{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac-soft)}
.shd{display:flex;align-items:center;gap:8px;cursor:pointer;min-width:0}
.shd .st{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shd .sq{flex:0 0 auto;font-variant-numeric:tabular-nums}
.shd .sa{flex:0 0 auto;font-size:12px;color:var(--mu)}
.skpi{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.skpi>div{background:var(--bg);border:1px solid var(--ln);border-radius:var(--radius-sm);padding:8px 10px;min-width:0}
.skpi b{display:block;font-size:15.5px;font-weight:650;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.skpi .mu{display:block;margin-bottom:2px;font-size:11.5px}
.sempty{font-size:12.5px;color:var(--mu);border:1px dashed var(--ln);border-radius:var(--radius-sm);padding:9px 12px}
.sbody{border-top:1px dashed var(--ln);margin-top:10px;padding-top:10px;display:grid;gap:7px;min-width:0}
.sline{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12.5px;min-width:0}
.sline>span:last-child,.sline>b{text-align:right;word-break:break-all}
.srow{border:1px solid var(--ln);border-radius:var(--radius-sm);padding:8px 10px;font-size:12.5px;min-width:0;background:var(--bg)}
.srow .nt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .q{color:var(--mu);font-variant-numeric:tabular-nums}

/* 烟贩实付价 */
.dprice{margin-top:8px;display:flex;flex-wrap:wrap;gap:5px;align-items:center;min-width:0}
.dprice .tag{font-size:11.5px;padding:2px 7px;border-radius:8px;border:1px solid var(--ln);color:var(--mu)}
.dprice .tag.warn{color:var(--ac);border-color:var(--ac);background:var(--ac-soft)}
.dtags{display:flex;flex-wrap:wrap;gap:5px;width:100%;min-width:0;margin-top:3px}

/* 英雄数字区 */
.hero{
  display:flex;gap:14px;align-items:flex-end;justify-content:space-between;
  margin:4px 0 12px;padding:6px 4px 14px;
  border-bottom:1px solid var(--ln);
}
.hl{display:flex;flex-direction:column;min-width:0}
.hl.r{text-align:right;align-items:flex-end}
.big{font-size:32px;line-height:1.12;letter-spacing:-.6px;font-weight:700}
.dense{margin-bottom:14px}
.dr{display:flex;justify-content:space-between;gap:10px;padding:6px 2px;border-bottom:1px dotted var(--ln)}
.dr b{font-weight:600}
.pc .ph{cursor:pointer}
.pc .n{font-size:20px;font-weight:650}
.bar2{display:flex;height:5px;border-radius:3px;overflow:hidden;margin-top:8px}
.bar2 i{display:block;height:100%}
.bt{background:var(--ink)}
.bd{background:var(--warn)}
.lg{font-size:12.5px;color:var(--mu);display:flex;gap:16px;align-items:center;margin:0 2px 10px;flex-wrap:wrap}
.lg i{display:inline-block;width:14px;height:5px;border-radius:3px;margin-right:5px;vertical-align:middle}

.aday{border:1px solid var(--ln);border-radius:10px;padding:10px 12px;background:var(--card);min-width:0}
.aday.on{border-color:var(--ink)}
.aday>.ahd{font-size:13.5px}
.adbody{display:grid;gap:7px;margin-top:8px;border-top:1px dashed var(--ln);padding-top:8px;min-width:0}

#mo{
  position:sticky;
  top:0;
  z-index:5;
  background:var(--bg);
  margin:0 0 12px 0;
  padding:10px 0 12px;
  /* 用足够高的实心阴影盖住下方滚动内容，消除缝隙透底 */
  box-shadow:0 16px 0 0 var(--bg);
  border-bottom:1px solid var(--ln);
}
*{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
html,body{-webkit-text-size-adjust:100%}
.tags{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.tg{padding:5px 13px;font-size:13px;min-height:32px;border-radius:18px}
.newtag{border:1px dashed var(--ln);border-radius:18px;padding:5px 11px}
mark{background:rgba(255,196,60,.4);color:inherit;border-radius:2px;padding:0 2px}

.prow{
  border:1px solid var(--ln);
  border-radius:10px;
  padding:10px 12px;
  margin-bottom:8px;
  background:var(--bg);
  min-width:0;
  transition:border-color .12s;
}
.prow.on{border-color:var(--ink);background:var(--card)}
.prow .ph{cursor:pointer}
.sk{display:inline-flex;align-items:center;gap:5px}
.sk button{width:40px;height:40px;font-size:20px;padding:0;border-radius:10px}
.sk .mu{min-width:16px}

#tabs{flex:0 0 auto;padding-top:10px;border-top:1px solid var(--ln);background:var(--bg)}
#tabs .tabs{margin-bottom:0}
#meta{display:flex;align-items:center;gap:6px;height:40px;white-space:nowrap;overflow-x:auto;scrollbar-width:none;margin-bottom:6px}
#meta::-webkit-scrollbar{display:none}
#meta button{min-height:30px;font-size:12.5px}
</style>
</head>
<body>
<h1>香烟进销记录</h1>
<div class="sub" id="meta"></div>
<div id="app"></div>
<nav id="tabs"></nav>
<script type="application/json" id="data">{"products":[],"log":{},"updated":""}</script>
<script>
const $=s=>document.querySelector(s);
const KEY='ciglog_data_v2';
let cardOpen=null,aDay=null;
const setDay=id=>{const r=((S.adjust&&S.adjust[month])||[]).find(x=>x.id===id);if(r)aDay=r.date||'none'};
const SCHEMA=2;                       // 备份 / 本地数据格式版本
const MAX_QTY=99999,MAX_MONEY=99999999;
const rb=k=>{try{const v=sessionStorage.getItem(k);return v&&v!=='all'?Number(v):'all'}catch(e){return 'all'}};
const ss=(k,v)=>{try{if(v===undefined)return sessionStorage.getItem(k);sessionStorage.setItem(k,v)}catch(e){}};
const ym=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
let tab=ss('tab')||'log',month=ss('month')||ym(new Date()),editor=false,edit=null,delId=null,status='',tm;
let bSel=rb('bsel_'+month),bEdit=null,bDel=null,aEdit=null,aDel=null,aOpen=null,sumOpen=null;
let pick={open:false,q:'',pid:null,newProd:false,newName:''};

function loadData(){
  try{const raw=localStorage.getItem(KEY);if(raw)return JSON.parse(raw)}catch(e){}
  try{return JSON.parse($('#data').textContent)}catch(e){return {products:[],log:{}}}
}
let S=loadData();

function splitLog(log){
  const batches={},rest={};
  Object.keys(log).forEach(k=>{
    if(k==='batches'){Object.assign(batches,log[k]);return}
    const v=log[k],r={};
    if(v&&typeof v==='object'&&v.batches){batches[k]=v.batches}
    Object.keys(v||{}).forEach(id=>{if(id!=='batches')r[id]=v[id]});
    rest[k]=r;
  });
  return {batches,rest};
}
function migrate(){
  let B={};
  if(S._batches){B=S._batches;delete S._batches}
  if(S.log.batches){Object.assign(B,splitLog(S.log).batches)}
  const {rest}=splitLog(S.log);
  S.log=rest;
  S.log.batches=B;
  months().forEach(m=>{
    if(!S.log[m]||typeof S.log[m]!=='object'){S.log[m]={};return}
    Object.keys(S.log[m]).forEach(id=>{
      const v=S.log[m][id],p=P(id);
      if(Array.isArray(v)){S.log[m][id]=v.map(f=>({b:f.b||0,src:f.src,qty:f.qty,price:f.price}));return}
      if(typeof v==='number'){S.log[m][id]=v?[{b:0,src:'t',qty:v,price:p?p.cost:0}]:[]}
      else if(v&&typeof v==='object'){
        const a=[];
        if(v.t)a.push({b:0,src:'t',qty:v.t,price:p?p.cost:0});
        if(v.d)a.push({b:0,src:'d',qty:v.d,price:p?(p.cost2||p.cost):0});
        S.log[m][id]=a;
      }else{S.log[m][id]=[]}
    });
  });
}

const fmt=n=>(Math.round(n*100)/100).toLocaleString('zh-CN');
const fmt0=n=>Math.round(n).toLocaleString('zh-CN');
const sg=n=>(n>0.004?'+':n<-0.004?'−':'')+fmt(Math.abs(n));
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P=id=>S.products.find(p=>p.id===id);
const num=v=>{const s=String(v==null?'':v).trim();if(!s)return 0;const n=Number(s);return Number.isFinite(n)?n:0};
// ===== 输入边界校验 & 旧数据清洗 =====
function chkQty(v,label){
  const s=String(v==null?'':v).trim();
  if(!/^\d+$/.test(s))return {ok:false,msg:(label||'条数')+'请填 0 或正整数，不要填小数、负号或文字'};
  const n=Number(s);
  if(n>MAX_QTY)return {ok:false,msg:(label||'条数')+'不能超过 '+MAX_QTY+'，请检查是否多输了 0'};
  return {ok:true,val:n};
}
function chkMoney(v,label,allowNeg){
  const s=String(v==null?'':v).trim();
  if(!s)return {ok:true,val:0,empty:true};
  if(!/^-?\d+(\.\d{1,2})?$/.test(s))return {ok:false,msg:(label||'金额')+'请填数字，最多两位小数'};
  const n=Number(s);
  if(!allowNeg&&n<0)return {ok:false,msg:(label||'金额')+'不能填负数'};

function sanitize(){
  if(!Array.isArray(S.products))S.products=[];
  if(!S.log||typeof S.log!=='object')S.log={};
  if(!S.adjust||typeof S.adjust!=='object')S.adjust={};
  Object.keys(S.log).forEach(k=>{
    if(k!=='batches'&&(!S.log[k]||typeof S.log[k]!=='object'))S.log[k]={};
  });
  S.products.forEach(p=>{
    p.name=String(p.name||'').slice(0,60);
    p.cost=Math.min(MAX_MONEY,Math.max(0,num(p.cost)));
    p.cost2=Math.min(MAX_MONEY,Math.max(0,num(p.cost2)));
    p.retail=Math.min(MAX_MONEY,Math.max(0,num(p.retail)));
    p.actual=Math.min(MAX_MONEY,Math.max(0,num(p.actual)));
    p.status=['在售','紧缺','停供'].indexOf(p.status)>=0?p.status:'在售';
    p.note=String(p.note||'').slice(0,200);
    if(p.costAt)p.costAt=String(p.costAt).slice(0,10);
    if(p.cost2At)p.cost2At=String(p.cost2At).slice(0,10);
  });
  months().forEach(m=>{
    Object.keys(S.log[m]).forEach(id=>{
      S.log[m][id]=flow(m,id).map(f=>({
        b:Number.isFinite(Number(f.b))?Number(f.b):0,
        src:f.src==='d'?'d':'t',
        qty:Math.min(MAX_QTY,Math.max(0,Math.round(num(f.qty)))),
        price:Math.min(MAX_MONEY,Math.max(0,num(f.price)))
      })).filter(f=>f.qty>0);
      if(!S.log[m][id].length)delete S.log[m][id];
    });
  });
  Object.keys(S.adjust).forEach(m=>{
    if(!Array.isArray(S.adjust[m])){delete S.adjust[m];return}
    S.adjust[m]=S.adjust[m].filter(r=>r&&P(r.pid)).map(r=>({
      id:Number(r.id)||1,
      date:String(r.date||'').slice(0,10),
      pid:r.pid,
      qty:Math.min(MAX_QTY,Math.max(0,Math.round(num(r.qty)))),
      amount:Math.max(-MAX_MONEY,Math.min(MAX_MONEY,num(r.amount))),
      note:String(r.note||'').slice(0,200)
    }));
    if(!S.adjust[m].length)delete S.adjust[m];
  });
  S.stock=(Array.isArray(S.stock)?S.stock:[]).map((r,i)=>{
    const it={};
    if(r&&r.items&&typeof r.items==='object')Object.keys(r.items).forEach(k=>{if(S.products.some(p=>p.id===k))it[k]=Math.max(0,Math.min(99999,Math.round(num(r.items[k]))))});
    return {id:Math.max(1,Math.round(num(r&&r.id))||i+1),date:String((r&&r.date)||'').slice(0,10),items:it};
  }).filter(r=>/^\d{4}-\d{2}-\d{2}$/.test(r.date));
  const sids=new Set();S.stock.forEach(r=>{while(sids.has(r.id))r.id++;sids.add(r.id)});
  S.schema=SCHEMA;
}

const bts=m=>(S.log.batches&&S.log.batches[m])||[];
const bt=(m,id)=>bts(m).find(b=>b.id===id);
const inB=(f,b)=>!b||b==='all'||f.b===b;
const bqty=(m,id,b)=>flow(m,id).filter(f=>inB(f,b)).reduce((a,f)=>a+f.qty,0);
const bqtyOf=(m,id,b,src)=>flow(m,id).filter(f=>inB(f,b)&&f.src===src).reduce((a,f)=>a+f.qty,0);
const bcost=(m,id,b)=>flow(m,id).filter(f=>inB(f,b)).reduce((a,f)=>a+f.qty*f.price,0);
const bpriceOf=(m,id,b,src)=>{const f=flow(m,id).find(f=>inB(f,b)&&f.src===src);return f?f.price:''};
// 烟贩渠道：当前视图下的实付成本 / 加权实付均价（全部批次视图按月加权，单批视图即该批价）
const srcCost=(m,id,b,src)=>flow(m,id).filter(f=>inB(f,b)&&f.src===src).reduce((a,f)=>a+num(f.qty)*num(f.price),0);
const srcAvg=(m,id,b,src)=>{const q=bqtyOf(m,id,b,src);return q?srcCost(m,id,b,src)/q:0};
const btQty=(m,b)=>S.products.reduce((a,p)=>a+bqty(m,p.id,b),0);
const btCost=(m,b)=>S.products.reduce((a,p)=>a+bcost(m,p.id,b),0);
const btFlag=(m,b)=>S.products.reduce((a,p)=>a+bqty(m,p.id,b)*flagOf(p),0);
const qty=(m,id)=>bqty(m,id,'all');
const costOf=(m,id)=>bcost(m,id,'all');

const adjs=m=>(S.adjust&&S.adjust[m])||[];
// 账面按红旗价卖了，实际只抵/换了 amount 元
// 差额 d = 账面 − 实际：d>0 利润少了（扣），d<0 紧俏烟卖得比账面还高（加）
const adjImpact=m=>adjs(m).reduce((a,r)=>{

let syncMsg='';
// 烟贩价同步：每款烟取「日期最新」的一笔烟贩进货价，写进目录的烟贩价。
// 只处理比上次同步更新的进货；价格没变不动；历史流水一律不改；force=某款烟 id 时，该款可重新核对（改最新那笔的价）
function dealerSync(apply,force){
  const out=[];
  S.products.forEach(p=>{
    let best=null;
    months().forEach(m=>flow(m,p.id).forEach(f=>{
      if(f.src!=='d'||!(f.qty>0)||!(f.price>0))return;
      const b=bt(m,f.b),dt=(b&&b.date)||(m+'-01'),k=dt+'#'+String(f.b).padStart(6,'0');
      if(!best||k>best.k)best={k,dt,price:f.price};
    }));
    if(!best)return;
    if(p.id!==force&&p.cost2At&&best.dt<=p.cost2At)return;
    if(Math.abs((p.cost2||0)-best.price)>0.004)out.push({p,from:p.cost2||0,to:best.price,dt:best.dt});
    if(apply){p.cost2=best.price;p.cost2At=best.dt}
  });
  return out;
}

    const b=bt(m,f.b),dt=(b&&b.date)||(m+'-01'),k=dt+'#'+String(f.b).padStart(6,'0');
    if(!best||k>best.k)best={k,dt,price:f.price};
  }));
  return best;
}

function importData(file){

      const vs=d.schema==null?0:Number(d.schema);
      let note='';
      if(!Number.isFinite(vs)||vs<1)note='\n\n⚠️ 这份备份没有版本号（旧版导出），会按当前格式自动兼容导入。';
      else if(vs>SCHEMA)note='\n\n⚠️ 这份备份来自更新的格式（v'+vs+'），本文件是 v'+SCHEMA+'，可能读不全新字段，建议先留着原文件别删。';
      else if(vs<SCHEMA)note='\n\n这是 v'+vs+' 的旧备份，会自动升级到 v'+SCHEMA+'。';
      if(!confirm('导入将覆盖当前全部数据，确定继续？'+note))return;
      S=d;S.adjust=S.adjust||{};
      if(S._batches){S.log.batches=S._batches;delete S._batches}
      migrate();sanitize();
      edit=null;delId=null;editor=false;bEdit=null;bDel=null;aEdit=null;aDel=null;aOpen=null;sumOpen=null;stockDraft=null;

  };
  r.readAsText(file);
}

  const keep=flow(m,id).filter(f=>!(inB(f,b)&&f.src===src));

function setPrice(m,id,src,b,price){
  const r=chkMoney(price,'进货单价',false);

  const f=flow(m,id).find(f=>inB(f,b)&&f.src===src);
  if(f){
    const pp=P(id),def=pp?(src==='d'?(pp.cost2||pp.cost):pp.cost):0;
    f.price=r.empty?def:r.val;
    if(src==='d')dealerSync(true,id);

        '此更新不会影响任何历史进货记录。';

function adjProdOrder(){
  const cnt={};
  Object.keys(S.adjust||{}).forEach(m=>(S.adjust[m]||[]).forEach(r=>{cnt[r.pid]=(cnt[r.pid]||0)+1}));
  const of=prodAvgFn(),sc={};
  S.products.forEach(p=>{sc[p.id]=of(p)});
  return S.products.slice().sort((a,b)=>(cnt[b.id]||0)-(cnt[a.id]||0)||sc[b.id]-sc[a.id]||String(a.name).localeCompare(String(b.name),'zh')).map(p=>({p,n:cnt[p.id]||0}));
}
let tagCache=[];
function adjTagList(q){
  const cnt={},last={};let k=0;
  Object.keys(S.adjust||{}).sort().forEach(m=>(S.adjust[m]||[]).forEach(r=>{const n=String(r.note||'').trim();if(n){cnt[n]=(cnt[n]||0)+1;last[n]=k++}}));
  const kw=q.trim().toLowerCase();
  return Object.keys(cnt).filter(n=>!kw||n.toLowerCase().includes(kw)).sort((a,b)=>cnt[b]-cnt[a]||last[b]-last[a]).slice(0,10).map(n=>[n,cnt[n]]);
}

// ===== 烟贩实付价可视化 =====
// 主徽标：当前视图下烟贩渠道的加权实付均价，与目录参考价对比；改过价就标红。
// 价签：仅当同一视图里出现两种以上实付价时展开，逐批次列出「第N次 @单价 ×条数」。
function dPriceTags(m,p,b){
  const all=flow(m,p.id).filter(f=>inB(f,b)&&f.src==='d'&&num(f.qty)>0);
  if(!all.length)return '';
  const base=p.cost2||0,hasBase=!!p.cost2;
  const q=all.reduce((a,f)=>a+num(f.qty),0);
  const avg=all.reduce((a,f)=>a+num(f.qty)*num(f.price),0)/q;
  const dd=hasBase?avg-base:0,changed=hasBase&&Math.abs(dd)>=0.005;
  const main='<span class="tag'+(changed?' warn':'')+'">'+(b==='all'?'本月':'本批')+'烟贩实付 '+fmt(avg)+'/条'+
    (hasBase?(changed?' · 比目录'+(dd>0?'+':'')+fmt(dd):' · 同目录价'):' · 目录未设参考价')+'</span>';
  const SB=sortedBatches(m);
  const byB=SB.filter(x=>b==='all'||x.id===b).map(x=>({
    i:SB.indexOf(x)+1,
    q:bqtyOf(m,p.id,x.id,'d'),
    pr:bpriceOf(m,p.id,x.id,'d')
  })).filter(x=>x.q>0&&x.pr!==''&&x.pr!=null);
  const uniq=new Set(byB.map(x=>num(x.pr)));
  let detail='';
  if(uniq.size>1){
    detail='<div class="dtags">'+byB.map(x=>{
      const pr=num(x.pr),off=hasBase&&Math.abs(pr-base)>=0.005;
      return '<span class="tag'+(off?' warn':'')+'">第'+x.i+'次 @'+fmt(pr)+' ×'+x.q+'</span>';
    }).join('')+'</div>';
  }
  return '<div class="dprice">'+main+detail+'</div>';
}

function srcRow(src,label,m,p,b,q){

// 真实时间轴：以最新有记录的月为终点往前 12 个自然月，空月留白不压缩
function sumAxis(){
  const all=Array.from(new Set([
    ...Object.keys(S.log||{}).filter(k=>k!=='batches'),
    ...Object.keys(S.adjust||{})
  ])).filter(m=>/^\d{4}-\d{2}$/.test(m));
  const rec=all.filter(sumHas);
  if(!rec.length)return [];
  rec.sort();
  const first=rec[0],[ly,lm]=rec[rec.length-1].split('-').map(Number);
  const out=[];
  for(let i=11;i>=0;i--)out.push(ym(new Date(ly,lm-1-i,1)));
  return out.filter(m=>m>=first).reverse();
}

function sumStat(m){

}

function trendSVG(axis){
  const ms=axis.slice().reverse(),W=320,H=96,pl=4,pt=8,pb=18,iw=W-pl*2,ih=H-pt-pb,bw=iw/ms.length;
  const st=ms.map(m=>sumHas(m)?sumStat(m):null),mxN=Math.max(1,...st.map(s=>s?s.n:0));
  const rv=st.filter(Boolean).map(s=>s.real),lo=Math.min(0,...rv),hi=Math.max(0,...rv),sp=(hi-lo)||1;
  const x=i=>pl+bw*i+bw/2,yr=v=>pt+ih*(1-(v-lo)/sp);
  let bars='',pts=[],lab='';
  ms.forEach((m,i)=>{const s=st[i];
    if(s){const h2=ih*s.n/mxN;bars+='<rect x="'+(x(i)-bw*.3)+'" y="'+(pt+ih-h2)+'" width="'+bw*.6+'" height="'+h2+'" rx="2" fill="var(--mu)" opacity=".3"/>';pts.push([x(i),yr(s.real)])}
    lab+='<text x="'+x(i)+'" y="'+(H-5)+'" text-anchor="middle" font-size="9" fill="var(--mu)">'+Number(m.slice(5))+'</text>'});
  const line=pts.length>1?'<polyline points="'+pts.map(q=>q.join(',')).join(' ')+'" fill="none" stroke="var(--tx)" stroke-width="1.5"/>':'';
  const dots=pts.map(q=>'<circle cx="'+q[0]+'" cy="'+q[1]+'" r="2.5" fill="var(--tx)"/>').join('');
  const zero=lo<0?'<line x1="'+pl+'" x2="'+(W-pl)+'" y1="'+yr(0)+'" y2="'+yr(0)+'" stroke="var(--ln)"/>':'';
  return '<div class="card" style="padding:10px 12px"><div class="mu">月度趋势 · 灰柱＝开烟条数（最高 '+mxN+' 条） · 黑线＝接近真实利润（'+fmt0(lo)+' 至 '+fmt0(hi)+' 元）</div><svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block;margin-top:6px">'+zero+bars+line+dots+lab+'</svg></div>';
}

    const open=prodSel===p.id||delId===p.id;
    const noteHit=kw&&String(p.note||'').toLowerCase().includes(kw);
    h+='<div class="prow'+(open?' on':'')+'"><div class="row ph" data-act="prodSel" data-v="'+p.id+'"><div><b>'+hl(p.name,kw)+'</b></div>'+
      '<span class="mu">烟草 '+fmt(p.cost)+'/条'+(avg>0?' · 月均 '+fmt(avg):'')+' '+(open?'▴':'▾')+'</span></div>'+
      (noteHit&&!open?'<div class="mu" style="margin-top:4px">'+hl(p.note,kw)+'</div>':'');
    if(open){
      h+='<div class="mu" style="margin-top:8px">烟草 '+fmt(p.cost)+'/条'+(p.costAt?'（同步自 '+md(p.costAt)+'）':'')+(p.cost2?' · 烟贩 '+fmt(p.cost2)+'/条'+(p.cost2At?'（同步自 '+md(p.cost2At)+' 进货）':''):'')+' · 建议零售 '+fmt(p.retail)+'/包（'+fmt(p.retail*10)+'/条）· 红旗 '+fmt(flagOf(p))+'/条</div>'+
        '<div class="mu">建议价毛利 '+fmt(m)+'/条'+(p.actual?' · 红旗毛利 <span class="'+(p.actual-p.cost>=0?'ok':'err')+'">'+fmt(p.actual-p.cost)+'</span>/条':'')+(p.cost2?' · 目录烟贩价利润（参考）<span class="'+(flagOf(p)-p.cost2>=0?'ok':'err')+'">'+fmt(flagOf(p)-p.cost2)+'</span>/条':'')+(avg>0?' · 月均 <span class="ok">'+fmt(avg)+'</span> 条':'')+'</div>'+
        (p.note?'<div class="badge">'+hl(p.note,kw)+'</div>':'')+
        (di?'<div class="err" style="font-size:12px;margin-top:6px">⚠️ 再点一次将永久删除「'+esc(p.name)+'」，并连带清掉 '+di.ms+' 个月份的 '+di.fs+' 笔进货流水'+(di.as?'、'+di.as+' 笔特殊处置':'')+'，无法撤销。若只是不再进了，留着就行，历史会保留。</div>':'')+
        '<div class="row" style="margin-top:8px;justify-content:flex-end;gap:8px"><button data-act="edit" data-v="'+p.id+'">编辑</button><button data-act="del" data-v="'+p.id+'">'+(delId===p.id?'再点确认删除':'删除')+'</button></div>';
    }
    h+='</div>';
  });
  return h+'<div class="mu" style="margin-top:6px">删除会同时清除该烟的历史流水；不再进的烟留着就行，不必删。</div>';
}
function refreshProdList(){
  const l=$('#ps_list');
  if(l&&!(edit&&edit!=='new'))l.innerHTML=prodListHTML();
}
function viewProd(){
  let h='';
  if(edit==='new'){
    h+='<div class="card"><b>新增烟品</b>'+prodFields({name:'',cost:'',cost2:'',retail:'',actual:'',status:'在售',note:''},'f')+
      '<div class="row"><button data-act="cancel">取消</button><button class="on" data-act="saveP">确定</button></div></div>';
  }else{
    h+='<div class="card"><div class="row ph" data-act="new"><b>＋ 新增烟品</b><span class="mu">▾</span></div></div>';
  }
  h+='<div class="card"><div class="row ph" data-act="prodAll"><b>全部烟品 <span class="mu">'+S.products.length+' 款</span></b><span class="mu">'+(prodAll?'▴':'▾')+'</span></div>'+
    (prodAll?'<input id="ps_q" type="text" inputmode="search" enterkeyhint="search" autocomplete="off" placeholder="搜索烟名 / 备注" value="'+esc(prodQ)+'" style="margin-top:8px"><div id="ps_list" style="margin-top:8px">'+prodListHTML()+'</div>':'')+'</div>';
  return h+stockCardHTML();
}

function scrollChipIntoView(){
  const chip=document.querySelector('#app .chips .chip.on');
  if(chip && chip.parentElement){
    const parent=chip.parentElement;
    const target=chip.offsetLeft - (parent.clientWidth - chip.offsetWidth)/2;
    parent.scrollLeft=Math.max(0, target);   // 直接瞬间定位，不做动画
  }
}

function render(){
  meta();
  // 交互状态若还指向已被删除 / 已不存在的烟品或批次，先复位，避免渲染时报错白屏
  if(pick.pid&&!P(pick.pid))pick={open:false,q:'',pid:null,newProd:false,newName:''};
  if(edit&&edit!=='new'&&!P(edit)){edit=null;delId=null}
  if(bSel!=='all'&&!bt(month,bSel))bSel='all';
  const adjIds=adjs(month).map(r=>r.id);
  if(aOpen&&adjIds.indexOf(aOpen)<0)aOpen=null;
  if(aEdit&&aEdit!==true&&adjIds.indexOf(aEdit)<0)aEdit=null;
  if(aDel&&adjIds.indexOf(aDel)<0)aDel=null;
  if(sumOpen&&!sumHas(sumOpen))sumOpen=null;
  const app=$('#app'),st0=app.scrollTop;
  $('#tabs').innerHTML=tabs();app.innerHTML=(tab==='log'?viewLog():tab==='sum'?viewSum():viewProd());
  if(pick.focus&&pick.open&&!pick.pid&&!pick.newProd){pick.focus=false;const el=$('#pk_q');if(el){el.focus({preventScroll:true});el.setSelectionRange(el.value.length,el.value.length)}}
  if(aEdit){refreshAdjRef();refreshAdjTags()}
  refreshNameHint();refreshRetailTip();
  app.scrollTop=st0;
  requestAnimationFrame(()=>{requestAnimationFrame(scrollChipIntoView)});
}

let composing=false;
const typingId=id=>id==='pk_q'||id==='f_name'||id==='qp_name'||id==='ps_q'||id==='st_q';
document.addEventListener('compositionstart',e=>{ if(typingId(e.target.id))composing=true; });
document.addEventListener('compositionend',e=>{
  composing=false;
  const id=e.target.id;
  if(id==='pk_q'){pick.q=e.target.value;refreshPickList()}
  else if(id==='f_name'||id==='qp_name')refreshNameHint();
  else if(id==='a_note')refreshAdjTags();
  else if(id==='ps_q'){prodQ=e.target.value;refreshProdList()}
  else if(id==='st_q'){stockQ=e.target.value;refreshStockList()}
});
document.addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='pk_q'){
    pick.q=e.target.value;
    if(!composing)refreshPickList();
  }
  if((id==='f_name'||id==='qp_name')&&!composing)refreshNameHint();
  if(id==='a_qty'||id==='a_pid'||id==='a_amt')refreshAdjRef();
  if(id==='a_note'&&!composing)refreshAdjTags();
  if(id==='ps_q'){prodQ=e.target.value;if(!composing)refreshProdList()}
  if(id==='st_q'){stockQ=e.target.value;if(!composing)refreshStockList()}
  if(id==='f_retail'||id==='qp_retail')refreshRetailTip();
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='mo'&&t.value){
    month=t.value;ss('month',month);bSel=rb('bsel_'+month);
    bEdit=null;bDel=null;edit=null;aEdit=null;aDel=null;aOpen=null;sumOpen=null;
    pick={open:false,q:'',pid:null,newProd:false,newName:''};
    render();return;
  }
  if(t.dataset&&t.dataset.act==='price'){
    if(bSel==='all'){
      alert('全部批次视图不能修改价格，请先选择具体批次。');
      render();
      return;
    }
    if(!setPrice(month,t.dataset.v,t.dataset.src,curB(),t.value)){
      alert('进货单价请填数字，最多两位小数，且不能为负数。');
      render();return;
    }
    touch();
  }
  if(t.id==='st_date'&&stockDraft)stockDraft.date=t.value;
  if(t.id==='a_pid'||t.id==='a_qty'||t.id==='a_amt')refreshAdjRef();
  if(t.id==='impFile'&&t.files&&t.files[0])importData(t.files[0]);
});
document.addEventListener('focusout',e=>{
  if(e.target.dataset&&e.target.dataset.act==='price')render();
});
document.addEventListener('keydown',e=>{
  if(e.target.id==='pk_q'){
    if(e.key==='Escape'){pick={open:false,q:'',pid:null,newProd:false,newName:''};render()}
    if(e.key==='Enter'){
      const kw=pick.q.trim().toLowerCase();
      const list=S.products.filter(p=>(!kw||p.name.toLowerCase().includes(kw)));
      if(list.length===1){pick.pid=list[0].id;pick.q='';render()}
    }
  }
});

function curB(){
  if(bSel&&bSel!=='all'&&bt(month,bSel))return bSel;
  const f=bts(month)[0];
  return f?f.id:'all';
}
function ensureB(){
  if(bts(month).length)return curB();
  return addBatch(month,defaultBatchDate(),'');
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,src=b.dataset.src;
  let v=b.dataset.v;
  if(v!==undefined&&!isNaN(Number(v)))v=Number(v);
  if(a==='tab'){tab=v;ss('tab',v);edit=null;bEdit=null;pick={open:false,q:'',pid:null,newProd:false,newName:''};render();$('#app').scrollTop=0;return}
  if(a==='cardToggle'){cardOpen=(cardOpen===v?null:v);render();return}
  if(a==='adjTag'){const n=tagCache[v];if(n!==undefined){$('#a_note').value=n;refreshAdjTags()}return}
  if(a==='stockToggle'){stockOpen=!stockOpen;render();return}
  if(a==='stockSel'){const L0=stockSorted()[0],cur=stockSel===null?(L0&&L0.id):stockSel;stockSel=(cur===v?0:v);stockDelId=null;render();return}
  if(a==='stockNew'){stockDraft={id:null,date:todayStr(),vals:{}};stockQ='';render();return}
  if(a==='stockEdit'){const r=(S.stock||[]).find(x=>x.id===v);if(!r)return;stockDraft={id:r.id,date:r.date,vals:Object.assign({},r.items)};stockQ='';stockDelId=null;render();return}
  if(a==='stockCancel'){if(Object.keys(stockDraft.vals).length&&!confirm('放弃这次盘点？已填的内容不会保存。'))return;stockDraft=null;render();return}
  if(a==='stStep'&&stockDraft){const k=b.dataset.k,dd=Number(b.dataset.d),cur=stockDraft.vals[v]||0;stockDraft.vals[v]=Math.max(0,Math.min(99999,cur+(k==='c'?10:1)*dd));refreshStockList();return}
  if(a==='stZero'&&stockDraft){stockDraft.vals[v]=0;refreshStockList();return}
  if(a==='stClear'&&stockDraft){delete stockDraft.vals[v];refreshStockList();return}
  if(a==='stockDel'){
    if(stockDelId!==v){stockDelId=v;render();return}
    S.stock=(S.stock||[]).filter(r=>r.id!==v);stockDelId=null;stockSel=null;touch();render();return
  }
  if(a==='stockSave'&&stockDraft){
    const d=stockDraft,dt=($('#st_date')||{}).value||d.date;
    if(!dt){alert('请选择盘点日期。');return}
    const ids=Object.keys(d.vals).filter(k=>d.vals[k]!==undefined&&P(k));
    if(!ids.length){alert('还没有填任何一款。没存货的烟不用填，但至少要数一款再保存。');return}
    S.stock=S.stock||[];
    const other=S.stock.find(r=>r.date===dt&&r.id!==d.id);
    if(!confirm('已填 '+ids.length+' 款，其余 '+(S.products.length-ids.length)+' 款按 0 计。'+(other?'\n\n这一天已经有一次盘点，保存会覆盖它。':'')+'\n\n确认保存？'))return;
    const items={};ids.forEach(k=>{items[k]=d.vals[k]});
    if(other)S.stock=S.stock.filter(r=>r.id!==other.id);
    let sid=d.id;
    const ex=sid?S.stock.find(x=>x.id===sid):null;
    if(ex){ex.date=dt;ex.items=items}
    else{sid=S.stock.reduce((m,r)=>Math.max(m,r.id),0)+1;S.stock.push({id:sid,date:dt,items})}
    stockSel=sid;stockDraft=null;touch();render();return
  }
  if(a==='prodAll'){prodAll=!prodAll;render();return}
  if(a==='prodSel'){prodSel=(prodSel===v?null:v);render();return}
  if(a==='adjDay'){aDay=(aDay===v?null:v);aOpen=null;if(aEdit!==true)aEdit=null;aDel=null;render();return}
  if(a==='sumToggle'){sumOpen=(sumOpen===v?null:v);render();return}
  if(a==='selB'){bSel=v;ss('bsel_'+month,v);bEdit=null;bDel=null;render();return}
  if(a==='export'){exportData();return}
  if(a==='import'){$('#impFile').click();return}
  if(a==='openPick'){
    if(bSel==='all'){
      alert('请先选择一个具体批次，再录入开烟记录。');
      return;
    }
    pick={open:true,q:'',pid:null,newProd:false,newName:'',focus:true};
    bSel=curB();
    ss('bsel_'+month,bSel);
    render();
    return;
}
  if(a==='quickNew'){
    pick.newName=(pick.q||'').trim();pick.newProd=true;pick.pid=null;render();return
  }
  if(a==='quickCancel'){pick.newProd=false;pick.newName='';pick.focus=true;render();return}
  if(a==='quickSave'){
    const err=chkProdForm('qp');if(err){alert(err);return}
    const d=readProd('qp');
    const dup=dupOf(d.name,null);
    if(dup){alert('目录里已经有同名烟品了：'+dup.name+'。请换个名字，或点「返回搜索」直接选它。');return}
    const np=Object.assign({id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)},d);
    S.products.push(np);
    pick.newProd=false;pick.newName='';pick.pid=np.id;pick.q='';
    touch();render();return
  }
  if(a==='closePick'){pick={open:false,q:'',pid:null,newProd:false,newName:''};render();return}
  if(a==='repick'){pick.pid=null;pick.q='';pick.focus=true;render();return}
  if(a==='pick'){pick.pid=v;pick.q='';render();return}
  if(a==='inc'||a==='dec'){
    if(bSel==='all'){
      alert('当前是「全部批次」视图，请先选择具体批次再修改。');
      return;
    }
    const p=P(v);if(!p)return;
    const bid=ensureB(),s=src||'t';
    const cur=bqtyOf(month,v,bid,s);
    const next=a==='inc'?cur+1:cur-1;
    const ph=s==='d'?(p.cost2||p.cost):p.cost;
    const before=bpriceOf(month,v,bid,s);
    setQty(month,v,s,bid,next,before!==''?before:ph);
    if(bSel!==bid){bSel=bid;ss('bsel_'+month,bid)}
    touch();render();
  }else if(a==='newB'){bEdit='new';bDel=null;render()}
  else if(a==='editB'){bEdit=v;bDel=null;render()}
  else if(a==='cancelB'){bEdit=null;render()}
  else if(a==='saveB'){
    const d=$('#b_date').value||'';
    const n=$('#b_note').value.trim();
    if(bEdit==='new'){
      const id=addBatch(month,d,n);bSel=id;ss('bsel_'+month,id);
    }else{
      const bt0=bt(month,bEdit);
      if(bt0){bt0.date=d;bt0.note=n}
      bSel=bEdit;ss('bsel_'+month,bEdit);
    }
    bEdit=null;touch();render();
  }else if(a==='delB'){
    if(bDel!==v){bDel=v;render();return}
    delBatch(month,v);
    if(bSel===v||bSel===String(v))bSel='all';
    ss('bsel_'+month,bSel);
    bDel=null;touch();render();
  }else if(a==='adjNew'){
    if(!S.products.length){alert('先到「烟品目录」添加烟品，才能记特殊处置。');return}
    aEdit=true;aOpen=null;aDel=null;render();return
  }else if(a==='adjToggle'){
    setDay(v);aOpen=(aOpen===v?null:v);aEdit=null;aDel=null;render();return
  }else if(a==='adjEdit'){
    setDay(v);aOpen=v;aEdit=v;aDel=null;render();return
  }else if(a==='adjCancel'){aEdit=null;render();return}
  else if(a==='adjSave'){
    const pid=$('#a_pid').value;
    const qc=chkQty($('#a_qty').value,'条数');
    if(!qc.ok){alert(qc.msg);return}
    if(!pid||!qc.val){alert('请选择烟品，并填写条数。');return}
    const q=qc.val,p0=P(pid);
    if(!p0){alert('这款烟已不存在，请重新选择。');return}
    const ac=chkMoney($('#a_amt').value,'实际抵 / 换到的金额',true);
    if(!ac.ok){alert(ac.msg);return}
    const amt=ac.empty?q*p0.cost:ac.val;
    const d={date:$('#a_date').value||defaultBatchDate(),pid,qty:q,amount:amt,note:$('#a_note').value.trim()};
    S.adjust=S.adjust||{};
    const arr=S.adjust[month]=S.adjust[month]||[];
    const editingId=(aEdit!==true&&aEdit!=null)?aEdit:null;
    let keepOpen=aOpen;
    if(editingId){
      const r=arr.find(x=>x.id===editingId);
      if(!r){alert('这笔记录已不存在，请重新点开条目。');aEdit=null;render();return}
      Object.assign(r,d);
      keepOpen=editingId;
    }else{
      const id=arr.reduce((x,r)=>Math.max(x,r.id),0)+1;
      arr.push(Object.assign({id},d));
      keepOpen=id;
    }
    aEdit=null;aOpen=keepOpen;aDay=d.date||'none';aDel=null;touch();render();return
  }else if(a==='adjDel'){
    if(aDel!==v){aDel=v;render();return}
    S.adjust[month]=(S.adjust[month]||[]).filter(r=>r.id!==v);
    if(!S.adjust[month].length)delete S.adjust[month];
    if(aOpen===v)aOpen=null;
    if(aEdit===v)aEdit=null;
    aDel=null;touch();render();return
  }else if(a==='new'){edit='new';render()}
  else if(a==='edit'){edit=v;prodAll=true;prodSel=v;render()}
  else if(a==='cancel'){edit=null;render()}
  else if(a==='saveP'){
    const err=chkProdForm('f');if(err){alert(err);return}
    const d=readProd('f');
    const dup=dupOf(d.name,edit==='new'?null:edit);
    if(dup){alert('已经有同名烟品了：'+dup.name);return}
    if(edit==='new'){
      S.products.push(Object.assign({id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)},d));
    }else{
      const oldP=P(edit);
      // 若烟草官方进货价发生变更，给出明确提示：仅影响今后默认值，历史流水不变
      if(oldP&&Math.abs((oldP.cost||0)-d.cost)>0.004){
        const last=lastTobaccoPrice(edit);
        const lastTxt=last
          ? '最近一次实际烟草进货价为 '+fmt(last.price)+' 元（来自 '+last.dt+' 的批次）'
          : '目前尚无烟草渠道进货记录';
        const msg=lastTxt+'。\n\n是否将目录参考价改为 '+fmt(d.cost)+' 元，并作为该烟品今后的默认烟草进货价？\n此更改不会修改任何历史进货记录。';
        if(!confirm(msg))return;
        d.costAt=todayStr();
      }
      // 保留原有 costAt / cost2At（除非本次主动改了 cost）
      if(d.costAt===undefined&&oldP.costAt)d.costAt=oldP.costAt;
      if(oldP.cost2At)d.cost2At=oldP.cost2At;
      Object.assign(oldP,d);
    }
    edit=null;touch();render();
  }else if(a==='del'){
    if(delId!==v){delId=v;render();return}
    S.products=S.products.filter(p=>p.id!==v);
    months().forEach(m=>{delete S.log[m][v]});
    if(S.adjust)Object.keys(S.adjust).forEach(m=>{
      S.adjust[m]=S.adjust[m].filter(r=>r.pid!==v);
      if(!S.adjust[m].length)delete S.adjust[m];
    });
    delId=null;touch();render();
 }else if(a==='editCard'){
    editor=(editor===v?null:v);if(editor)cardOpen=v;
    render();
  }
});

migrate();
sanitize();
{const ch=dealerSync(true);
  if(ch.length){
    syncMsg='烟贩价已同步 '+ch.length+' 款';save();
    setTimeout(()=>alert('已按每款烟最近一次的烟贩进货价，更新了烟品目录：\n\n'+ch.slice(0,20).map(c=>c.p.name+'：'+(c.from?fmt(c.from)+' → ':'新增 ')+fmt(c.to)).join('\n')+(ch.length>20?'\n…共 '+ch.length+' 款':'')+'\n\n历史进货记录没有改动。'),400);
  }}
render();
